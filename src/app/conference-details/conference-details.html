<article class="card" [class.booked]="isBooked()">
  <span class="tag">{{ conference().sujet }}</span>
  <h3>{{ conference().nom }}</h3>
  <p class="meta">📅 {{ conference().date }} • 📍 {{ conference().lieu }}</p>
  <p class="places">{{ conference().places }} places • {{ isBooked() ? '✅ Réservée' : 'Disponible' }}</p>

  <button (click)="onToggle()">
    {{ isBooked() ? 'Annuler' : 'Réserver' }}
  </button>
</article>
